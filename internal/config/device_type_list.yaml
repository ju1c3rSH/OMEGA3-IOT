# device_types.yaml
# 物联网物模型定义 - 支持动态扩展、实例化 ID、OTA 升级

version: "1.0.0"  # 物模型版本，用于兼容性检查

device_types:
  # ============================================================================
  # 类型 1: BaseTracker - 基础追踪器
  # ============================================================================
  - id: 1
    name: "BaseTracker"
    description: "支持定位、电量监控、紧急报警的追踪设备"

    # ── 能力声明 (Capabilities) ──
    # 设备硬件支持的功能特性，用于前端动态渲染和权限控制
    capabilities:
      gps_module:
        description: "支持 GPS/北斗定位"
        required: true
      cellular:
        description: "支持 4G/Cat.1 通信"
        required: true
      siren:
        description: "支持蜂鸣器报警"
        required: false
      motion_sensor:
        description: "支持加速度计/陀螺仪"
        required: false

    # ── 属性定义 (Properties) ──
    # key 作为属性名，用于代码引用和实例 ID 生成
    properties:
      battery_level:
        writable: true
        description: "当前电量百分比"
        unit: "%"
        range: [0, 100]
        format: "int"
        required: true

      battery_capacity:
        writable: false
        description: "电池额定容量（静态规格）"
        unit: "mAh"
        format: "int"
        required: false

      gps_location:
        writable: false
        description: "GPS 坐标，格式: \"纬度,经度\""
        format: "string"
        pattern: "^-?\\d+\\.\\d+,-?\\d+\\.\\d+$"  # 正则校验
        required: false

      signal_strength:
        writable: false
        description: "通信信号强度 (dBm)"
        unit: "dBm"
        range: [-110, -30]
        format: "int"
        required: false

      device_status:
        writable: true
        description: "设备运行状态"
        format: "string"
        enum: ["online", "offline", "sleep", "error"]
        required: true

    # ── 事件定义 (Events) ──
    # 设备主动上报的通知，支持动态扩展（OTA 新增事件无需改后端代码）
    events:
      low_battery_alarm:
        description: "电量低于阈值时主动上报"
        severity: "warning"  # info | warning | critical
        output_params:
          - name: "current_level"
            type: "int"
            description: "当前电量"
          - name: "threshold"
            type: "int"
            description: "触发阈值"
        retention_days: 30  # 事件日志保留天数

      sos_alert:
        description: "SOS 紧急报警（设备检测到异常自动触发）"
        severity: "critical"
        output_params:
          - name: "location"
            type: "string"
            description: "触发时的位置"
          - name: "trigger_reason"
            type: "string"
            enum: ["button_press", "fall_detected", "geo_fence_exit"]
        retention_days: 365

      motion_detected:
        description: "检测到移动"
        severity: "info"
        output_params:
          - name: "acceleration"
            type: "float"
            description: "加速度值"
          - name: "timestamp"
            type: "int"
            description: "检测时间戳"
        # 条件触发：仅当设备具备对应能力时才生效
        required_capabilities: ["motion_sensor"]

    # ── 动作定义 (Actions) ──
    # 云端/用户下发的控制指令，每次调用生成唯一的 instance_action_id
    actions:
      reboot:
        description: "远程重启设备"
        input_params: []  # 无参数
        timeout_sec: 30   # 期望设备在 30 秒内回复执行结果
        idempotent: true  # 是否幂等：重复调用无副作用

      sos_trigger:
        description: "远程模拟触发 SOS（测试用）"
        input_params:
          - name: "reason"
            type: "string"
            description: "触发原因说明"
            required: false
        timeout_sec: 10
        idempotent: false

      update_config:
        description: "下发配置更新"
        input_params:
          - name: "report_interval"
            type: "int"
            description: "数据上报间隔(秒)"
            range: [60, 3600]
            required: true
          - name: "gps_enable"
            type: "bool"
            description: "是否启用 GPS"
            required: true
        timeout_sec: 60
        idempotent: true

  # ============================================================================
  # 类型 2: SmartSensor - 智能环境传感器
  # ============================================================================
  - id: 2
    name: "SmartSensor"
    description: "温湿度、光照等环境监测传感器"

    capabilities:
      temp_sensor:
        description: "温度传感器"
        required: true
      humidity_sensor:
        description: "湿度传感器"
        required: true
      light_sensor:
        description: "光照传感器"
        required: false
      low_power_mode:
        description: "支持低功耗休眠"
        required: false

    properties:
      temperature:
        writable: false
        description: "环境温度"
        unit: "°C"
        range: [-40, 85]
        format: "float"
        required: true

      humidity:
        writable: false
        description: "环境湿度"
        unit: "%"
        range: [0, 100]
        format: "float"
        required: true

      light_intensity:
        writable: false
        description: "光照强度"
        unit: "lux"
        range: [0, 100000]
        format: "int"
        required: false
        required_capabilities: ["light_sensor"]

      sample_rate:
        writable: true
        description: "数据采集频率"
        unit: "seconds"
        format: "int"
        enum: [30, 60, 300, 600]
        required: false

    events:
      threshold_exceeded:
        description: "监测值超过设定阈值"
        severity: "warning"
        output_params:
          - name: "metric"
            type: "string"
            enum: ["temperature", "humidity", "light_intensity"]
            description: "超限的指标"
          - name: "current_value"
            type: "float"
            description: "当前值"
          - name: "threshold"
            type: "float"
            description: "阈值"
          - name: "direction"
            type: "string"
            enum: ["above", "below"]
            description: "超限方向"
        retention_days: 90

      sensor_error:
        description: "传感器硬件异常"
        severity: "critical"
        output_params:
          - name: "sensor_type"
            type: "string"
            description: "异常传感器类型"
            enum: ["temperature", "humidity", "light"]
          - name: "error_code"
            type: "int"
            description: "错误码"
          - name: "recoverable"
            type: "bool"
            description: "是否可恢复"
        retention_days: 365

    actions:
      calibrate:
        description: "校准传感器"
        input_params:
          - name: "target_type"
            type: "string"
            enum: ["temperature", "humidity", "all"]
            description: "校准目标"
            required: true
          - name: "reference_value"
            type: "float"
            description: "参考值（可选）"
            required: false
        timeout_sec: 120
        idempotent: false

      set_sample_rate:
        description: "动态调整采样频率"
        input_params:
          - name: "interval_sec"
            type: "int"
            range: [30, 3600]
            description: "采样间隔（秒）"
            required: true
        timeout_sec: 30
        idempotent: true

  # ============================================================================
  # 类型 3: ToggleMachine - 开关控制设备
  # ============================================================================
  - id: 3
    name: "ToggleMachine"
    description: "远程开关控制设备，支持状态反馈"

    capabilities:
      relay_output:
        description: "继电器输出控制"
        required: true
      status_feedback:
        description: "支持开关状态实时反馈"
        required: true
      power_meter:
        description: "支持电量统计"
        required: false

    properties:
      switch_status:
        writable: true
        description: "开关状态"
        format: "bool"
        required: true

      last_toggle_time:
        writable: false
        description: "上次切换状态的时间戳"
        format: "int"  # 时间戳使用 int 类型
        required: false

      power_consumption:
        writable: false
        description: "累计用电量"
        unit: "kWh"
        range: [0, 1000000]
        format: "float"
        required: false
        required_capabilities: ["power_meter"]

      overload_threshold:
        writable: true
        description: "过载保护阈值(瓦)"
        unit: "W"
        range: [100, 5000]
        format: "int"
        required: false

    events:
      status_changed:
        description: "开关状态变更通知"
        severity: "info"
        output_params:
          - name: "new_status"
            type: "bool"
            description: "新状态"
          - name: "trigger_source"
            type: "string"
            enum: ["remote", "local", "auto", "error"]
            description: "触发源"
          - name: "timestamp"
            type: "int"
            description: "变更时间戳"
        retention_days: 30

      overload_protected:
        description: "过载保护触发，自动断电"
        severity: "critical"
        output_params:
          - name: "current_power"
            type: "int"
            description: "当前功率(W)"
          - name: "threshold"
            type: "int"
            description: "阈值(W)"
          - name: "trigger_time"
            type: "int"
            description: "触发时间戳"
        retention_days: 365

    actions:
      toggle:
        description: "切换开关状态"
        input_params:
          - name: "target_status"
            type: "bool"
            description: "目标状态（true=开，false=关，不传则翻转）"
            required: false
        timeout_sec: 10
        idempotent: true

      schedule_toggle:
        description: "设置定时开关"
        input_params:
          - name: "cron_expr"
            type: "string"
            description: "Cron 表达式，如 \"0 8 * * *\""
            required: true
          - name: "target_status"
            type: "bool"
            description: "目标状态"
            required: true
          - name: "timezone"
            type: "string"
            description: "时区，如 \"Asia/Shanghai\""
            enum: ["UTC", "Asia/Shanghai", "America/New_York"]
            default: "UTC"
            required: false
        timeout_sec: 30
        idempotent: false

  # ============================================================================
  # 类型 4: NewsReporter - AI驱动时事新闻分析设备
  # ============================================================================
  - id: 4
    name: "NewsReporter"
    description: "AI驱动的时事新闻分析设备，定时搜集全球新闻并通过Claude分析生成报告"

    capabilities:
      news_collector:
        description: "新闻数据搜集能力（RSS/API）"
        required: true
      claude_cli:
        description: "Claude Code CLI 执行能力"
        required: true

    properties:
      latest_report:
        writable: false
        description: "最新报告摘要"
        format: "string"
        required: true

      full_report_markdown:
        writable: false
        description: "完整Markdown报告全文"
        format: "markdown"
        required: true

      last_execution_time:
        writable: false
        description: "最近一次执行时间"
        format: "time"
        required: true

      online_time:
        writable: false
        description: "设备在线时间"
        format: "time"
        required: true

      status:
        writable: false
        description: "状态机"
        format: "string"
        enum: ["idle", "collecting", "analyzing", "uploading", "error"]
        required: true

      last_error:
        writable: false
        description: "最近一次错误信息"
        format: "string"
        required: false

      report_count:
        writable: false
        description: "累计报告生成次数"
        format: "int"
        required: true

      schedule_cron:
        writable: true
        description: "执行调度cron表达式"
        format: "string"
        required: true

    events:
      report_generated:
        description: "报告生成完成"
        severity: "info"
        output_params:
          - name: "summary"
            type: "string"
            description: "报告摘要"
          - name: "report_length"
            type: "int"
            description: "报告字数"
          - name: "sources_count"
            type: "int"
            description: "数据源数量"
        retention_days: 90

      execution_error:
        description: "执行过程中发生错误"
        severity: "warning"
        output_params:
          - name: "error_message"
            type: "string"
            description: "错误信息"
          - name: "stage"
            type: "string"
            description: "失败阶段"
            enum: ["collecting", "analyzing", "uploading"]
        retention_days: 90

      content_alert:
        description: "检测到重大经济/政治/民生变化"
        severity: "critical"
        output_params:
          - name: "domain"
            type: "string"
            description: "领域"
            enum: ["economy", "politics", "livelihood", "technology", "security"]
          - name: "alert_summary"
            type: "string"
            description: "重大变化摘要"
          - name: "impact_level"
            type: "string"
            description: "影响级别"
            enum: ["high", "critical"]
        retention_days: 365

    actions:
      execute_now:
        description: "立即触发一次报告生成"
        input_params: []
        timeout_sec: 600
        idempotent: false

      get_prompt:
        description: "获取当前提示词配置"
        input_params: []
        timeout_sec: 10
        idempotent: true

      update_prompt:
        description: "更新提示词"
        input_params:
          - name: "new_prompt"
            type: "string"
            description: "新的提示词内容"
            required: true
        timeout_sec: 10
        idempotent: true

      update_template_vars:
        description: "更新模板变量"
        input_params:
          - name: "variables"
            type: "string"
            description: "JSON格式的模板变量键值对"
            required: true
        timeout_sec: 10
        idempotent: true

      set_schedule:
        description: "修改执行频率"
        input_params:
          - name: "cron_expr"
            type: "string"
            description: "cron表达式（如 \"*/30 * * * *\"）"
            required: true
        timeout_sec: 10
        idempotent: true

      pause:
        description: "暂停自动执行"
        input_params: []
        timeout_sec: 10
        idempotent: true

      resume:
        description: "恢复自动执行"
        input_params: []
        timeout_sec: 10
        idempotent: true

      get_status:
        description: "查询当前详细状态"
        input_params: []
        timeout_sec: 10
        idempotent: true

  # ============================================================================
  # 类型 5: LocallyNewsReporter - 地方民生新闻报道设备
  # ============================================================================
  - id: 5
    name: "LocallyNewsReporter"
    description: "AI驱动的地方民生新闻报道设备，定时搜集本地新闻并生成地方民生简报"

    capabilities:
      news_collector:
        description: "新闻数据搜集能力"
        required: true
      claude_cli:
        description: "Claude Code CLI 执行能力"
        required: true
      web_scraper:
        description: "本地新闻网站抓取能力"
        required: true

    properties:
      city:
        writable: true
        description: "关注城市"
        format: "string"
        required: true

      districts:
        writable: true
        description: "关注区域列表"
        format: "json"
        required: true

      aliases:
        writable: true
        description: "城市别名列表"
        format: "json"
        required: false

      latest_report:
        writable: false
        description: "最新报告摘要"
        format: "string"
        required: true

      full_report_markdown:
        writable: false
        description: "完整Markdown报告全文"
        format: "markdown"
        required: true

      last_execution_time:
        writable: false
        description: "最近一次执行时间"
        format: "time"
        required: true

      online_time:
        writable: false
        description: "设备在线时间"
        format: "time"
        required: true

      status:
        writable: false
        description: "状态机"
        format: "string"
        enum: ["idle", "discovering", "collecting", "analyzing", "uploading", "error"]
        required: true

      last_error:
        writable: false
        description: "最近一次错误信息"
        format: "string"
        required: false

      report_count:
        writable: false
        description: "累计报告生成次数"
        format: "int"
        required: true

      schedule_cron:
        writable: true
        description: "执行调度cron表达式"
        format: "string"
        required: true

      discovery_cron:
        writable: true
        description: "新闻源发现调度cron表达式"
        format: "string"
        required: false

      max_sites:
        writable: true
        description: "最大搜集站点数"
        format: "int"
        range: [1, 50]
        required: false

    events:
      report_generated:
        description: "地方新闻简报生成完成"
        severity: "info"
        output_params:
          - name: "summary"
            type: "string"
            description: "报告摘要"
          - name: "report_length"
            type: "int"
            description: "报告字数"
          - name: "sources_count"
            type: "int"
            description: "数据源数量"
          - name: "city"
            type: "string"
            description: "报道城市"
        retention_days: 90

      execution_error:
        description: "执行过程中发生错误"
        severity: "warning"
        output_params:
          - name: "error_message"
            type: "string"
            description: "错误信息"
          - name: "stage"
            type: "string"
            description: "失败阶段"
            enum: ["discovering", "collecting", "analyzing", "uploading"]
        retention_days: 90

      content_alert:
        description: "检测到重大民生变化"
        severity: "critical"
        output_params:
          - name: "domain"
            type: "string"
            description: "领域"
            enum: ["traffic", "housing", "consumption", "healthcare", "education", "weather", "municipal", "community", "policy"]
          - name: "alert_summary"
            type: "string"
            description: "重大变化摘要"
          - name: "impact_level"
            type: "string"
            description: "影响级别"
            enum: ["high", "critical"]
        retention_days: 365

      site_discovered:
        description: "发现新的本地新闻源"
        severity: "info"
        output_params:
          - name: "site_url"
            type: "string"
            description: "新闻源URL"
          - name: "site_name"
            type: "string"
            description: "新闻源名称"
        retention_days: 30

    actions:
      execute_now:
        description: "立即触发一次新闻简报生成"
        input_params: []
        timeout_sec: 600
        idempotent: false

      get_prompt:
        description: "获取当前提示词配置"
        input_params: []
        timeout_sec: 10
        idempotent: true

      update_prompt:
        description: "更新提示词"
        input_params:
          - name: "new_prompt"
            type: "string"
            description: "新的提示词内容"
            required: true
        timeout_sec: 10
        idempotent: true

      update_template_vars:
        description: "更新模板变量"
        input_params:
          - name: "variables"
            type: "string"
            description: "JSON格式的模板变量键值对"
            required: true
        timeout_sec: 10
        idempotent: true

      set_schedule:
        description: "修改执行频率"
        input_params:
          - name: "cron_expr"
            type: "string"
            description: "cron表达式（如 \"*/20 * * * *\"）"
            required: true
        timeout_sec: 10
        idempotent: true

      update_region:
        description: "更新关注地区配置"
        input_params:
          - name: "city"
            type: "string"
            description: "城市名称"
            required: true
          - name: "districts"
            type: "string"
            description: "JSON格式的区域列表"
            required: true
          - name: "aliases"
            type: "string"
            description: "JSON格式的城市别名列表"
            required: false
        timeout_sec: 10
        idempotent: true

      discover_sites:
        description: "触发一次本地新闻源发现"
        input_params:
          - name: "search_queries"
            type: "string"
            description: "JSON格式的搜索关键词列表"
            required: false
        timeout_sec: 300
        idempotent: false

      pause:
        description: "暂停自动执行"
        input_params: []
        timeout_sec: 10
        idempotent: true

      resume:
        description: "恢复自动执行"
        input_params: []
        timeout_sec: 10
        idempotent: true

      get_status:
        description: "查询当前详细状态"
        input_params: []
        timeout_sec: 10
        idempotent: true

  # ============================================================================
  # 类型 6: FinReporter - AI金融投资分析参考设备
  # ============================================================================
  - id: 6
    name: "FinReporter"
    description: "AI驱动的金融投资分析参考设备：采集财经新闻，产出盘前简报/盘后总结/即时预警/周报，纯中性分析"

    capabilities:
      news_collector:
        description: "财经新闻采集能力（RSS/API/网页抓取）"
        required: true
      claude_cli:
        description: "Claude Code CLI 执行能力"
        required: true

    properties:
      latest_report:
        writable: false
        description: "最新报告摘要"
        format: "string"
        required: true

      full_report_markdown:
        writable: false
        description: "完整Markdown报告全文"
        format: "markdown"
        required: true

      report_type:
        writable: false
        description: "最新报告类型"
        format: "string"
        enum: ["briefing", "review", "breaking", "weekly"]
        required: false

      alert_level:
        writable: false
        description: "预警级别"
        format: "string"
        enum: ["none", "info", "warning", "critical"]
        required: false

      markets:
        writable: false
        description: "覆盖市场列表（JSON数组）"
        format: "json"
        required: false

      watchlist_hits:
        writable: false
        description: "报告命中的跟踪清单标的（JSON数组）"
        format: "json"
        required: false

      last_execution_time:
        writable: false
        description: "上次报告完成时间"
        format: "time"
        required: true

      online_time:
        writable: false
        description: "设备上线时间"
        format: "time"
        required: true

      status:
        writable: false
        description: "状态值"
        format: "string"
        enum: ["idle", "collecting", "analyzing", "uploading", "error", "offline"]
        required: true

      last_error:
        writable: false
        description: "最后一次错误信息"
        format: "string"
        required: false

      report_count:
        writable: false
        description: "累计报告生成次数"
        format: "int"
        required: true

      schedule_cron:
        writable: true
        description: "执行调度cron表达式（JSON: briefing/review/weekly/breaking）"
        format: "json"
        required: false

      daily_summary:
        writable: false
        description: "每日会话压缩摘要"
        format: "string"
        required: false

    events:
      fin_report_generated:
        description: "金融分析报告已生成"
        severity: "info"
        output_params:
          - name: "report_type"
            type: "string"
            description: "报告类型"
          - name: "summary"
            type: "string"
            description: "报告摘要"
          - name: "report_length"
            type: "int"
            description: "报告长度"
          - name: "sources_count"
            type: "int"
            description: "信源数量"
          - name: "new_items"
            type: "int"
            description: "新条目数量"
          - name: "cached_items"
            type: "int"
            description: "缓存条目数量"
          - name: "watchlist_hits"
            type: "string"
            description: "命中的跟踪清单"
        retention_days: 90

      fin_breaking_alert:
        description: "重大财经事件即时预警"
        severity: "warning"
        output_params:
          - name: "title"
            type: "string"
            description: "触发事件标题"
          - name: "urgency"
            type: "int"
            description: "紧急程度评分"
          - name: "markets"
            type: "string"
            description: "涉及市场"
          - name: "sectors"
            type: "string"
            description: "涉及板块"
          - name: "watchlist"
            type: "string"
            description: "涉及跟踪清单"
          - name: "summary"
            type: "string"
            description: "分析摘要"
        retention_days: 90

      daily_compacted:
        description: "每日会话压缩完成"
        severity: "info"
        output_params: []
        retention_days: 30

    actions:
      execute_now:
        description: "立即生成一次报告（按当前时段选择类型）"
        input_params: []
        timeout_sec: 600
        idempotent: false

      get_prompt:
        description: "获取当前提示词模板"
        input_params: []
        timeout_sec: 10
        idempotent: true

      update_prompt:
        description: "更新提示词"
        input_params:
          - name: "new_prompt"
            type: "string"
            description: "新的提示词内容"
            required: true
        timeout_sec: 10
        idempotent: true

      update_template_vars:
        description: "更新模板变量"
        input_params:
          - name: "variables"
            type: "string"
            description: "JSON格式的模板变量键值对"
            required: true
        timeout_sec: 10
        idempotent: true

      set_schedule:
        description: "修改执行频率"
        input_params:
          - name: "cron_expr"
            type: "string"
            description: "cron表达式"
            required: true
        timeout_sec: 10
        idempotent: true

      pause:
        description: "暂停自动执行"
        input_params: []
        timeout_sec: 10
        idempotent: true

      resume:
        description: "恢复自动执行"
        input_params: []
        timeout_sec: 10
        idempotent: true

      get_status:
        description: "查询当前详细状态"
        input_params: []
        timeout_sec: 10
        idempotent: true
  # ============================================================================
  # 类型 7: ElderlySmartSeeder - 适老化智能电动播种机
  # ============================================================================
  - id: 7
    name: "ElderlySmartSeeder"
    description: "适老化智能电动播种机，面向老年用户的低速/大按钮/语音辅助电动播种设备"

    capabilities:
      auto_seeding:
        description: "支持自动播种控制"
        required: true
      voice_assistant:
        description: "支持语音提示与播报（适老化关键能力）"
        required: true
      obstacle_avoidance:
        description: "支持超声波/红外避障"
        required: false
      emergency_brake:
        description: "支持紧急制动"
        required: true
      low_power_mode:
        description: "支持低功耗休眠"
        required: false
      gps_module:
        description: "支持 GPS/北斗定位"
        required: false

    properties:
      battery_level:
        writable: false
        description: "当前电量百分比"
        unit: "%"
        range: [0, 100]
        format: "int"
        required: true

      seed_level:
        writable: false
        description: "剩余种子量百分比"
        unit: "%"
        range: [0, 100]
        format: "int"
        required: true

      seeding_depth:
        writable: true
        description: "播种深度"
        unit: "cm"
        range: [1, 10]
        format: "float"
        required: true

      row_spacing:
        writable: true
        description: "行距"
        unit: "cm"
        range: [10, 50]
        format: "int"
        required: true

      operation_mode:
        writable: true
        description: "工作模式"
        format: "string"
        enum: ["manual", "auto", "assist"]
        required: true

      speed:
        writable: true
        description: "行驶速度（适老化限速）"
        unit: "m/s"
        range: [0, 1.5]
        format: "float"
        required: true

      device_status:
        writable: false
        description: "设备运行状态"
        format: "string"
        enum: ["idle", "seeding", "paused", "error", "charging", "returning"]
        required: true

      voice_volume:
        writable: true
        description: "语音播报音量"
        range: [0, 100]
        format: "int"
        required: false

      last_error:
        writable: false
        description: "最近错误信息"
        format: "string"
        required: false

      total_area:
        writable: false
        description: "累计播种面积"
        unit: "m2"
        range: [0, 1000000]
        format: "float"
        required: false

    events:
      low_seed_alarm:
        description: "种子余量不足告警"
        severity: "warning"
        output_params:
          - name: "current_level"
            type: "int"
            description: "当前种子余量(%)"
          - name: "threshold"
            type: "int"
            description: "告警阈值(%)"
        retention_days: 30

      obstacle_detected:
        description: "检测到前方障碍物自动暂停"
        severity: "warning"
        output_params:
          - name: "distance_cm"
            type: "float"
            description: "障碍物距离(cm)"
          - name: "action"
            type: "string"
            description: "处置动作"
            enum: ["paused", "avoided"]
        retention_days: 30
        required_capabilities: ["obstacle_avoidance"]

      seeding_completed:
        description: "播种作业完成"
        severity: "info"
        output_params:
          - name: "area_m2"
            type: "float"
            description: "本次作业面积(m2)"
          - name: "duration_sec"
            type: "int"
            description: "作业时长(秒)"
        retention_days: 90

      emergency_stop_triggered:
        description: "紧急制动触发"
        severity: "critical"
        output_params:
          - name: "trigger_source"
            type: "string"
            description: "触发源"
            enum: ["button", "fall_detected", "obstacle", "remote"]
          - name: "location"
            type: "string"
            description: "触发时位置"
        retention_days: 365

      low_battery_alarm:
        description: "电量过低告警"
        severity: "warning"
        output_params:
          - name: "current_level"
            type: "int"
            description: "当前电量(%)"
          - name: "threshold"
            type: "int"
            description: "告警阈值(%)"
        retention_days: 30

    actions:
      start_seeding:
        description: "开始播种"
        input_params: []
        timeout_sec: 10
        idempotent: false

      pause_seeding:
        description: "暂停播种"
        input_params: []
        timeout_sec: 10
        idempotent: true

      stop_seeding:
        description: "停止并复位"
        input_params: []
        timeout_sec: 10
        idempotent: true

      set_seeding_params:
        description: "设置播种参数（深度/行距/速度）"
        input_params:
          - name: "depth_cm"
            type: "float"
            description: "播种深度(cm)"
            range: [1, 10]
            required: true
          - name: "row_spacing_cm"
            type: "int"
            description: "行距(cm)"
            range: [10, 50]
            required: true
          - name: "speed_ms"
            type: "float"
            description: "行驶速度(m/s)"
            range: [0, 1.5]
            required: false
        timeout_sec: 30
        idempotent: true

      set_voice_volume:
        description: "设置语音播报音量（适老化）"
        input_params:
          - name: "volume"
            type: "int"
            description: "音量 0-100"
            range: [0, 100]
            required: true
        timeout_sec: 10
        idempotent: true

      emergency_stop:
        description: "紧急制动"
        input_params: []
        timeout_sec: 5
        idempotent: true

      return_home:
        description: "一键返航/回桩"
        input_params: []
        timeout_sec: 60
        idempotent: false

      reboot:
        description: "远程重启设备"
        input_params: []
        timeout_sec: 30
        idempotent: true
